name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest
      - run: python -m build
      - run: python scripts/audit_public_tree.py
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/specir-smoke
          /tmp/specir-smoke/bin/pip install dist/*.whl
          /tmp/specir-smoke/bin/specir-demo --output /tmp/specir-demo.db
          SPEC_IR_DB=/tmp/specir-demo.db /tmp/specir-smoke/bin/python -c "from specir.query.tools import resolve; assert resolve('command', 'A1h')['result']['name'] == 'Read Telemetry'"
